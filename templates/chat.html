<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Assistant</title>

<style>
/* =========================
   GLOBAL
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    background: #f3f4f6;
    height: 100vh;
    display: flex;
    color: #111827;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 300px;
    background: #ffffff;
    border-right: 1px solid #e5e7eb;
    display: flex;
    flex-direction: column;
}

.sidebar-header {
    padding: 18px;
    border-bottom: 1px solid #e5e7eb;
}

.new-chat {
    width: 100%;
    padding: 14px;
    border: none;
    background: #111827;
    color: white;
    border-radius: 12px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    transition: all 0.2s ease;
}

.new-chat:hover {
    background: #000;
    transform: translateY(-1px);
}

.chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.chat-item {
    padding: 14px;
    margin-bottom: 4px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    transition: all 0.15s ease;
}

.chat-item:hover {
    background: #f3f4f6;
}

.chat-item.active {
    background: #e5e7eb;
    font-weight: 600;
}

/* =========================
   MAIN AREA
========================= */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #ffffff;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

/* Message row */

.message {
    display: flex;
    width: 100%;
}

/* User right */

.message.user {
    justify-content: flex-end;
}

/* Bot left */

.message.assistant {
    justify-content: flex-start;
}

/* Bubble base */

.bubble {
    padding: 14px 18px;
    border-radius: 18px;
    max-width: 70%;
    font-size: 16px;
    line-height: 1.6;
    word-break: break-word;
}

/* User bubble style */

.message.user .bubble {
    background: #111827;
    color: white;
    border-bottom-right-radius: 4px;
}

/* Bot bubble style */

.message.assistant .bubble {
    background: #f3f4f6;
    color: #111827;
    border-bottom-left-radius: 4px;
}

/* =========================
   INPUT AREA
========================= */

.input-area {
    padding: 20px;
    border-top: 1px solid #e5e7eb;
    background: #ffffff;
}

.input-box {
    display: flex;
    gap: 12px;
    max-width: 900px;
    margin: auto;
}

input {
    flex: 1;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid #d1d5db;
    font-size: 16px;
    outline: none;
    transition: border 0.2s ease, box-shadow 0.2s ease;
}

input:focus {
    border: 1px solid #111827;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
}

button.send {
    padding: 16px 22px;
    border: none;
    background: #111827;
    color: white;
    border-radius: 14px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    transition: all 0.2s ease;
}

button.send:hover {
    background: #000;
    transform: translateY(-1px);
}

/* =========================
   CODE BLOCKS
========================= */

.code-container {
    position: relative;
    margin-top: 14px;
}

pre {
    background: #0f172a;
    color: #e5e7eb;
    padding: 18px;
    border-radius: 12px;
    overflow-x: auto;
    font-size: 14px;
    line-height: 1.6;
}

.copy-btn {
    position: absolute;
    right: 12px;
    top: 12px;
    background: #1f2937;
    border: none;
    color: white;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s ease;
}

.copy-btn:hover {
    background: #374151;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar {
    width: 10px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: #9ca3af;
}
/* =========================
   WRITING INDICATOR
========================= */

.writing-indicator {
    display: inline-block;
    font-style: italic;
    opacity: 0.7;
}

.writing-dots::after {
    content: "";
    animation: writingDots 1.4s infinite;
}

@keyframes writingDots {

    0% { content: ""; }

    25% { content: "."; }

    50% { content: ".."; }

    75% { content: "..."; }

    100% { content: ""; }
}


</style>
</head>

<body>

<div class="sidebar">

    <div class="sidebar-header">
        <button class="new-chat" onclick="newChat()">+ New Chat</button>
    </div>

    <div class="chat-list" id="chatList"></div>

</div>

<div class="main">

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <div class="input-box">
            <input id="input" placeholder="Send a message..." onkeydown="if(event.key==='Enter')sendMessage()">
            <button class="send" onclick="sendMessage()">Send</button>
        </div>
    </div>

</div>

<script>

let currentChat = null

function escapeHtml(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
}

function renderMessage(role, content) {

    const container = document.createElement("div")
    container.className = "message " + role

    let html

    if(role === "assistant") {

        html = content.replace(/```(.*?)```/gs, function(match, code) {

            const safeCode = escapeHtml(code)

            return `
            <div class="code-container">
                <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                <pre>${safeCode}</pre>
            </div>`
        })

    } else {

        html = escapeHtml(content)

    }

    container.innerHTML = `<div class="bubble">${html}</div>`

    document.getElementById("messages").appendChild(container)

    scrollBottom()
}

function renderWritingIndicator() {

    const container = document.createElement("div")
    container.className = "message assistant"

    container.id = "writingBubble"

    container.innerHTML = `
        <div class="bubble">
            <span class="writing-indicator">
                writing<span class="writing-dots"></span>
            </span>
        </div>
    `

    document.getElementById("messages").appendChild(container)

    scrollBottom()
}

function removeWritingIndicator() {

    const el = document.getElementById("writingBubble")

    if(el) el.remove()
}

function scrollBottom() {
    const m = document.getElementById("messages")
    m.scrollTop = m.scrollHeight
}

async function sendMessage() {

    const input = document.getElementById("input")
    const text = input.value

    if (!text) return

    renderMessage("user", text)

    input.value = ""

    renderWritingIndicator()

    try {

        const res = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text,
                chat_id: currentChat,
                stream: true
            })
        })

        const reader = res.body.getReader()
        const decoder = new TextDecoder()

        removeWritingIndicator()

        // create empty assistant bubble
        const container = document.createElement("div")
        container.className = "message assistant"

        const bubble = document.createElement("div")
        bubble.className = "bubble"

        container.appendChild(bubble)
        document.getElementById("messages").appendChild(container)

        let fullText = ""

        while (true) {

            const { done, value } = await reader.read()

            if (done) break

            const chunk = decoder.decode(value)

            const lines = chunk.split("\n")

            for (const line of lines) {

                if (!line.trim()) continue

                const data = JSON.parse(line)

                if (data.chat_id)
                    currentChat = data.chat_id

                if (data.token) {

                    fullText += data.token

                    bubble.innerText = fullText

                    scrollBottom()
                }
            }
        }

        // re-render with code blocks support
        container.remove()
        renderMessage("assistant", fullText)

        loadChats()

    } catch (err) {

        removeWritingIndicator()

        renderMessage("assistant", "Error: connection failed")
    }
}


async function newChat() {

    const res = await fetch("/new_chat", {
        method: "POST"
    })

    const data = await res.json()

    currentChat = data.chat_id

    document.getElementById("messages").innerHTML = ""

    loadChats()
}

async function loadChats() {

    const res = await fetch("/get_chats")

    const chats = await res.json()

    const list = document.getElementById("chatList")

    list.innerHTML = ""

    for(const id in chats) {

        const div = document.createElement("div")

        div.className = "chat-item"

        if(id === currentChat)
            div.classList.add("active")

        div.innerText = chats[id].title

        div.onclick = () => loadChat(id)

        list.appendChild(div)
    }
}

async function loadChat(id) {

    currentChat = id

    const res = await fetch("/load_chat/" + id)

    const data = await res.json()

    const messages = document.getElementById("messages")

    messages.innerHTML = ""

    data.messages.forEach(m => renderMessage(m.role, m.content))

    loadChats()
}

function copyCode(btn) {

    const code = btn.nextElementSibling.innerText

    navigator.clipboard.writeText(code)

    btn.innerText = "Copied"

    setTimeout(() => btn.innerText = "Copy", 1000)
}

loadChats()

</script>

</body>
</html>
