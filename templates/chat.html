<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Assistant</title>

<link href="../static/chat.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="sidebar">

    <button class="new-chat" onclick="newChat()">
        New chat
    </button>

    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-footer">

        <div class="user-card" onclick="toggleUserMenu(event)">

            <div class="user-left">

                <div class="user-avatar" id="userAvatar">
                    U
                </div>

                <div class="user-text">

                    <div class="user-name" id="username">
                        User Name
                    </div>

                    <div class="user-email" id="userEmail">
                        user@email.com
                    </div>

                </div>

            </div>

            <div class="user-arrow">
            </div>

        </div>

    </div>

</div>

<div class="main">
    <div class="download-overlay" id="downloadOverlay">

    <div class="download-box">

        <div class="download-title">
            Files generated
        </div>

        <div class="download-list" id="downloadList">
            <!-- JS injects download buttons here -->
        </div>

        <button class="download-close" onclick="closeDownload()">Close</button>

    </div>

</div>
    <div class="messages" id="messages"></div>

<div class="input-area">

    <button id="voiceBtn" class="voice-btn" onclick="toggleRecording()">
        🎤
    </button>
    <div class="input-box">
    <textarea
        id="input"
        placeholder="Send a message..."
    ></textarea>

    <button onclick="sendMessage()" class="send">
        Send
    </button>
</div>
</div>


</div>


</div>

<script src="../static/script.js"></script>

</body>
</html>
