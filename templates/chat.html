<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Assistant</title>

<style>

/* RESET */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #343541;
    color: #ececf1;
    height: 100vh;
    display: flex;
}


/* SIDEBAR */

.sidebar {
    width: 260px;
    background: #202123;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #2a2b32;
}

.sidebar-header {
    padding: 10px;
    border-bottom: 1px solid #2a2b32;
}

.new-chat {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px solid #565869;
    color: #ececf1;
    border-radius: 6px;
    cursor: pointer;
}

.new-chat:hover {
    background: #2a2b32;
}

.chat-list {
    flex: 1;
    overflow-y: auto;
}

.chat-item {
    padding: 12px;
    cursor: pointer;
    color: #ececf1;
    border-bottom: 1px solid #2a2b32;
}

.chat-item:hover {
    background: #2a2b32;
}

.chat-item.active {
    background: #343541;
}


/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
}


/* MESSAGES */

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}


/* MESSAGE CONTAINER */

.message {
    display: flex;
    margin-bottom: 20px;
}

.message.user {
    justify-content: flex-end;
}

.message.assistant {
    justify-content: flex-start;
}


/* BUBBLES */

.bubble {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: 12px;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 15px;
}


/* USER bubble */

.message.user .bubble {
    background: #10a37f;
    color: white;
    border-bottom-right-radius: 4px;
}


/* ASSISTANT bubble */

.message.assistant .bubble {
    background: #444654;
    color: #ececf1;
    border-bottom-left-radius: 4px;
}


/* INPUT AREA */

.input-area {
    padding: 15px;
    background: #343541;
    border-top: 1px solid #2a2b32;
}

.input-box {
    display: flex;
    background: #40414f;
    border-radius: 8px;
    padding: 5px;
}

.input-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    padding: 10px;
    font-size: 15px;
}

.input-box input::placeholder {
    color: #8e8ea0;
}

.send {
    background: #10a37f;
    border: none;
    color: white;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
}

.send:hover {
    background: #0e8f6f;
}


/* CODE BLOCK */

.code-container {
    position: relative;
    background: #1e1e1e;
    border-radius: 8px;
    margin-top: 8px;
}

.code-container pre {
    margin: 0;
    padding: 14px;
    overflow-x: auto;
    color: #d4d4d4;
    font-family: Consolas, monospace;
    font-size: 14px;
}


/* COPY BUTTON */

.copy-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    background: #10a37f;
    border: none;
    color: white;
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 6px;
    cursor: pointer;
}

.copy-btn:hover {
    background: #0e8f6f;
}


/* WRITING INDICATOR */

.writing-indicator {
    color: #8e8ea0;
    font-style: italic;
}

.writing-dots::after {
    content: "...";
    animation: dots 1.5s infinite;
}

@keyframes dots {
    0% { content: "."; }
    33% { content: ".."; }
    66% { content: "..."; }
}


/* SCROLLBAR */

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: #565869;
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background: #6b6c7b;
}
.chat-item {
    padding: 12px;
    cursor: pointer;
    color: #ececf1;
    border-bottom: 1px solid #2a2b32;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.chat-title {
    flex: 1;
}

.chat-menu-btn {
    background: transparent;
    border: none;
    color: #8e8ea0;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
}

.chat-menu-btn:hover {
    background: #2a2b32;
    color: white;
}

.chat-menu {
    position: fixed;
    background: #202123;
    border: 1px solid #3a3b47;
    border-radius: 8px;
    overflow: hidden;
    z-index: 1000;
    min-width: 140px;
}

.chat-menu-item {
    padding: 10px 14px;
    cursor: pointer;
}

.chat-menu-item:hover {
    background: #2a2b32;
}

.chat-menu-item.delete {
    color: #ff6b6b;
}
.sidebar-footer {
    padding: 10px;
    border-top: 1px solid #2a2b32;
}

.user-info {
    padding: 10px;
    background: #2a2b32;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
}

.user-info:hover {
    background: #3a3b47;
}

.user-menu {
    position: fixed;
    background: #202123;
    border: 1px solid #3a3b47;
    border-radius: 8px;
    overflow: hidden;
    z-index: 1000;
    min-width: 180px;
}

.user-menu-item {
    padding: 10px;
    cursor: pointer;
}

.user-menu-item:hover {
    background: #2a2b32;
}

.user-menu-item.danger {
    color: #ff6b6b;
}


</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="sidebar">

    <div class="sidebar-header">
        <button class="new-chat" onclick="newChat()">+ New Chat</button>
    </div>

    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-footer">

    <div class="user-info" onclick="toggleUserMenu()">
        <span id="username">User</span>
        <span>⚙</span>
    </div>

</div>


</div>

<div class="main">

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <div class="input-box">
            <input id="input" placeholder="Send a message..." onkeydown="if(event.key==='Enter')sendMessage()">
            <button class="send" onclick="sendMessage()">Send</button>
        </div>
    </div>

</div>

<script>

let currentChat = null

function escapeHtml(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
}

function renderMessage(role, content) {

    const container = document.createElement("div")
    container.className = "message " + role

    let html

    if(role === "assistant") {

        html = content.replace(/```(.*?)```/gs, function(match, code) {

            const safeCode = escapeHtml(code)

            return `
            <div class="code-container">
                <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                <pre>${safeCode}</pre>
            </div>`
        })

    } else {

        html = escapeHtml(content)

    }

    container.innerHTML = `<div class="bubble">${html}</div>`

    document.getElementById("messages").appendChild(container)

    scrollBottom()
}

function renderWritingIndicator() {

    const container = document.createElement("div")
    container.className = "message assistant"

    container.id = "writingBubble"

    container.innerHTML = `
        <div class="bubble">
            <span class="writing-indicator">
                writing<span class="writing-dots"></span>
            </span>
        </div>
    `

    document.getElementById("messages").appendChild(container)

    scrollBottom()
}

function removeWritingIndicator() {

    const el = document.getElementById("writingBubble")

    if(el) el.remove()
}

function scrollBottom() {
    const m = document.getElementById("messages")
    m.scrollTop = m.scrollHeight
}

async function sendMessage() {

    const input = document.getElementById("input")
    const text = input.value

    if (!text) return

    renderMessage("user", text)

    input.value = ""

    renderWritingIndicator()

    try {

        const res = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text,
                chat_id: currentChat,
                stream: true
            })
        })

        const reader = res.body.getReader()
        const decoder = new TextDecoder()

        removeWritingIndicator()

        // create empty assistant bubble
        const container = document.createElement("div")
        container.className = "message assistant"

        const bubble = document.createElement("div")
        bubble.className = "bubble"

        container.appendChild(bubble)
        document.getElementById("messages").appendChild(container)

        let fullText = ""

        while (true) {

            const { done, value } = await reader.read()

            if (done) break

            const chunk = decoder.decode(value)

            const lines = chunk.split("\n")

            for (const line of lines) {

                if (!line.trim()) continue

                const data = JSON.parse(line)

                if (data.chat_id)
                    currentChat = data.chat_id

                if (data.token) {

                    fullText += data.token

                    bubble.innerText = fullText

                    scrollBottom()
                }
            }
        }

        // re-render with code blocks support
        container.remove()
        renderMessage("assistant", fullText)

        loadChats()

    } catch (err) {

        removeWritingIndicator()

        renderMessage("assistant", "Error: connection failed")
    }
}


function newChat() {

    currentChat = null

    document.getElementById("messages").innerHTML = ""
}

async function loadChats() {

    const res = await fetch("/get_chats")
    const chats = await res.json()

    const list = document.getElementById("chatList")
    list.innerHTML = ""

    for (const id in chats) {

        const div = document.createElement("div")
        div.className = "chat-item"

        if (id === currentChat)
            div.classList.add("active")

        const title = document.createElement("span")
        title.className = "chat-title"
        title.innerText = chats[id].title

        title.onclick = () => loadChat(id)

        const menuBtn = document.createElement("button")
        menuBtn.className = "chat-menu-btn"
        menuBtn.innerText = "⋯"

        menuBtn.onclick = (e) => {
            e.stopPropagation()
            toggleChatMenu(id, menuBtn)
        }

        div.appendChild(title)
        div.appendChild(menuBtn)

        list.appendChild(div)
    }
}


async function loadChat(id) {

    currentChat = id

    const res = await fetch("/load_chat/" + id)

    const data = await res.json()

    const messages = document.getElementById("messages")

    messages.innerHTML = ""

    data.messages.forEach(m => renderMessage(m.role, m.content))

    loadChats()
}

function copyCode(btn) {

    const code = btn.nextElementSibling.innerText

    navigator.clipboard.writeText(code)

    btn.innerText = "Copied"

    setTimeout(() => btn.innerText = "Copy", 1000)
}

loadChats()

let openMenu = null

function toggleChatMenu(chatId, btn) {

    closeMenu()

    const menu = document.createElement("div")
    menu.className = "chat-menu"

    menu.innerHTML = `
        <div class="chat-menu-item" onclick="renameChat('${chatId}')">Rename</div>
        <div class="chat-menu-item delete" onclick="deleteChat('${chatId}')">Delete</div>
    `

    document.body.appendChild(menu)

    const rect = btn.getBoundingClientRect()

    menu.style.top = rect.bottom + "px"
    menu.style.left = rect.left + "px"

    openMenu = menu

    setTimeout(() => {
        document.addEventListener("click", closeMenuOnce)
    }, 0)
}

function closeMenuOnce() {
    closeMenu()
    document.removeEventListener("click", closeMenuOnce)
}

function closeMenu() {
    if (openMenu) {
        openMenu.remove()
        openMenu = null
    }
}

async function renameChat(chatId) {

    const newName = prompt("New chat name:")

    if (!newName) return

    await fetch("/rename_chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            chat_id: chatId,
            title: newName
        })
    })

    loadChats()
}

async function deleteChat(chatId) {

    await fetch("/delete_chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            chat_id: chatId
        })
    })

    if (chatId === currentChat) {
        currentChat = null
        document.getElementById("messages").innerHTML = ""
    }

    loadChats()
}
let userMenu = null

function toggleUserMenu() {

    closeUserMenu()

    const menu = document.createElement("div")
    menu.className = "user-menu"

    menu.innerHTML = `
        <div class="user-menu-item" onclick="selectUser()">Switch user</div>
        <div class="user-menu-item" onclick="clearAllChats()">Delete all chats</div>
        <div class="user-menu-item danger" onclick="logout()">Logout</div>
    `

    document.body.appendChild(menu)

    const rect = document.querySelector(".user-info").getBoundingClientRect()

    menu.style.bottom = "60px"
    menu.style.left = rect.left + "px"

    userMenu = menu

    setTimeout(() => {
        document.addEventListener("click", closeUserMenuOnce)
    }, 0)
}

function closeUserMenuOnce() {
    closeUserMenu()
    document.removeEventListener("click", closeUserMenuOnce)
}

function closeUserMenu() {

    if (userMenu) {
        userMenu.remove()
        userMenu = null
    }
}
async function clearAllChats() {

    if (!confirm("Delete all chats?")) return

    await fetch("/delete_all_chats", {
        method: "POST"
    })

    currentChat = null

    document.getElementById("messages").innerHTML = ""

    loadChats()
}
function selectUser() {

    location.href = "/select_user"
}

</script>

</body>
</html>
