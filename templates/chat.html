<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Assistant</title>

<style>

/* =========================================================
   CHATGPT-LEVEL PROFESSIONAL UI
   Version: ULTRA PRO 2026
========================================================= */

:root {

    --bg-main: #343541;
    --bg-sidebar: #202123;
    --bg-hover: #2a2b32;
    --bg-active: #2f3038;

    --bg-user: #19c37d;
    --bg-ai: #444654;

    --bg-input: #40414f;

    --border: #2a2b32;
    --border-light: #3a3b47;

    --text-main: #ececf1;
    --text-secondary: #b4b4be;
    --text-muted: #8e8ea0;

    --accent: #19c37d;
    --accent-hover: #13a46b;

    --radius: 12px;

    --shadow:
        0 1px 2px rgba(0,0,0,0.2),
        0 8px 24px rgba(0,0,0,0.35);

}

/* RESET */

* {

    box-sizing: border-box;

}

html, body {

    margin: 0;
    height: 100%;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto;

    background: var(--bg-main);
    color: var(--text-main);

}

/* LAYOUT */

body {

    display: flex;
    overflow: hidden;

}

/* SIDEBAR */

.sidebar {

    width: 260px;
    background: var(--bg-sidebar);

    display: flex;
    flex-direction: column;

    border-right: 1px solid var(--border);

}

.new-chat {

    margin: 12px;

    padding: 12px;

    border-radius: 8px;

    border: 1px solid var(--border-light);

    background: transparent;

    color: white;

    cursor: pointer;

    transition: 0.2s;

}

.new-chat:hover {

    background: var(--bg-hover);
    border-color: var(--accent);

}

/* CHAT LIST */

.chat-list {

    flex: 1;
    overflow-y: auto;

    padding: 8px;

}

.chat-item {

    padding: 12px;

    border-radius: 8px;

    cursor: pointer;

    transition: 0.15s;

}

.chat-item:hover {

    background: var(--bg-hover);

}

.chat-item.active {

    background: var(--bg-active);

}

/* MAIN */

.main {

    flex: 1;

    display: flex;
    flex-direction: column;

}

/* MESSAGES */

.messages {

    flex: 1;

    overflow-y: auto;

    padding: 40px 20px;

}

/* MESSAGE ROW */

.message {

    display: flex;

    gap: 14px;

    margin-bottom: 28px;

    animation: fadeUp 0.25s ease;

}

/* AVATAR */

.avatar {

    width: 32px;
    height: 32px;

    border-radius: 6px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;

    flex-shrink: 0;

}

.avatar.user {

    background: var(--accent);
    color: white;

}

.avatar.ai {

    background: #565869;

}

/* BUBBLE */

.bubble {

    padding: 14px 18px;

    border-radius: var(--radius);

    box-shadow: var(--shadow);

    line-height: 1.6;

    max-width: 720px;

}

.message.user .bubble {

    background: var(--bg-user);

}

.message.assistant .bubble {

    background: var(--bg-ai);

}

/* STREAM CURSOR */

.cursor {

    display: inline-block;

    width: 8px;
    height: 18px;

    background: white;

    margin-left: 4px;

    animation: blink 1s infinite;

}

@keyframes blink {

    0%,50%,100% {opacity:1}
    25%,75% {opacity:0}

}

/* INPUT */

.input-area {

    padding: 20px;

}

.input-box {

    display: flex;

    align-items: center;

    background: var(--bg-input);

    border-radius: 14px;

    padding: 10px;

    box-shadow: var(--shadow);

}

/* TEXTAREA */

textarea {

    flex: 1;

    background: transparent;

    border: none;

    outline: none;

    color: white;

    resize: none;

    font-size: 15px;

    max-height: 200px;

}

/* SEND */

.send {

    background: var(--accent);

    border: none;

    padding: 10px 18px;

    border-radius: 8px;

    cursor: pointer;

    transition: 0.2s;

}

.send:hover {

    background: var(--accent-hover);

    transform: scale(1.05);

}

/* CODE */

pre {

    background: #1e1e1e;

    padding: 14px;

    border-radius: 8px;

    overflow-x: auto;

}

/* SCROLLBAR */

::-webkit-scrollbar {

    width: 8px;

}

::-webkit-scrollbar-thumb {

    background: #565869;
    border-radius: 6px;

}

/* ANIMATION */

@keyframes fadeUp {

    from {

        opacity: 0;
        transform: translateY(10px);

    }

    to {

        opacity: 1;
        transform: translateY(0);

    }

}

/* MOBILE */

@media (max-width: 800px) {

    .sidebar {

        display: none;

    }

}
/* =========================
   CHAT MENU (3 DOTS)
========================= */

.chat-menu {

    position: fixed;

    min-width: 180px;

    background: rgba(32,33,35,0.98);

    backdrop-filter: blur(12px);

    border-radius: 10px;

    border: 1px solid #3a3b47;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.4),
        0 0 0 1px rgba(255,255,255,0.02);

    padding: 6px;

    z-index: 9999;

    animation: menuFade 0.15s ease;

}

/* ITEM */

.chat-menu-item {

    padding: 10px 14px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 14px;

    color: #ececf1;

    transition: 0.15s;

    display: flex;
    align-items: center;
    gap: 8px;

}

/* HOVER */

.chat-menu-item:hover {

    background: #2a2b32;

}

/* DELETE */

.chat-menu-item.delete {

    color: #ff6b6b;

}
.chat-menu-btn {

    background: transparent;
    border: none;

    color: #8e8ea0;

    font-size: 18px;

    cursor: pointer;

    border-radius: 6px;

    padding: 4px 8px;

    opacity: 0;

    transition: 0.2s;

}

/* show only on hover */

.chat-item:hover .chat-menu-btn {

    opacity: 1;

}

.chat-menu-btn:hover {

    background: #2a2b32;
    color: white;

}

.chat-menu-item.delete:hover {

    background: rgba(255,107,107,0.1);

}

/* ANIMATION */

@keyframes menuFade {

    from {

        opacity: 0;
        transform: translateY(-6px) scale(0.96);

    }

    to {

        opacity: 1;
        transform: translateY(0) scale(1);

    }

}
/* =========================
   USER CARD
========================= */

.user-card {

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 10px;

    border-radius: 10px;

    cursor: pointer;

    transition: 0.2s;

}

.user-card:hover {

    background: #2a2b32;

}

/* LEFT SIDE */

.user-left {

    display: flex;
    align-items: center;
    gap: 10px;

}

/* AVATAR */

.user-avatar {

    width: 36px;
    height: 36px;

    border-radius: 8px;

    background: #19c37d;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;

    color: white;

}

/* TEXT */

.user-text {

    display: flex;
    flex-direction: column;

}

.user-name {

    font-size: 14px;
    font-weight: 500;

}

.user-email {

    font-size: 12px;
    color: #8e8ea0;

}

/* RIGHT ICON */

.user-arrow {

    color: #8e8ea0;

    font-size: 18px;

}

/* =========================
   USER MENU
========================= */

.user-menu {

    position: fixed;

    min-width: 220px;

    background: rgba(32,33,35,0.98);

    backdrop-filter: blur(10px);

    border-radius: 10px;

    border: 1px solid #3a3b47;

    box-shadow: 0 10px 30px rgba(0,0,0,0.4);

    padding: 6px;

    animation: menuFade 0.15s ease;

}

/* ITEM */

.user-menu-item {

    padding: 12px 14px;

    border-radius: 6px;

    cursor: pointer;

    font-size: 14px;

    transition: 0.15s;

}

.user-menu-item:hover {

    background: #2a2b32;

}

.user-menu-item.danger {

    color: #ff6b6b;

}

.user-menu-item.danger:hover {

    background: rgba(255,107,107,0.1);

}


</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="sidebar-footer">

    <div class="user-card" onclick="toggleUserMenu(event)">


        <div class="user-left">

            <div class="user-avatar" id="userAvatar">
                U
            </div>

            <div class="user-text">

                <div class="user-name" id="username">
                    User Name
                </div>

                <div class="user-email" id="userEmail">
                    user@email.com
                </div>

            </div>

        </div>

        <div class="user-arrow">
            ⋯
        </div>

    </div>

</div>



</div>

<div class="main">

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <div class="input-box">
<textarea id="input" placeholder="Send a message..."></textarea>
<button class="send" onclick="sendMessage()">Send</button>

        </div>
    </div>

</div>

<script>

let currentChat = null

function escapeHtml(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
}

function renderMessage(role, content) {

    const container = document.createElement("div")
    container.className = "message " + role

    let html

    if(role === "assistant") {

        html = content.replace(/```(.*?)```/gs, function(match, code) {

            const safeCode = escapeHtml(code)

            return `
            <div class="code-container">
                <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                <pre>${safeCode}</pre>
            </div>`
        })

    } else {

        html = escapeHtml(content)

    }

    container.innerHTML = `<div class="bubble">${html}</div>`

    document.getElementById("messages").appendChild(container)

    scrollBottom()
}

function renderWritingIndicator() {

    const container = document.createElement("div")
    container.className = "message assistant"

    container.id = "writingBubble"

    container.innerHTML = `
        <div class="bubble">
            <span class="writing-indicator">
                writing<span class="writing-dots"></span>
            </span>
        </div>
    `

    document.getElementById("messages").appendChild(container)

    scrollBottom()
}

function removeWritingIndicator() {

    const el = document.getElementById("writingBubble")

    if(el) el.remove()
}

function scrollBottom() {
    const m = document.getElementById("messages")
    m.scrollTop = m.scrollHeight
}

async function sendMessage() {

    const input = document.getElementById("input")
    const text = input.value

    if (!text) return

    renderMessage("user", text)

    input.value = ""

    renderWritingIndicator()

    try {

        const res = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text,
                chat_id: currentChat,
                stream: true
            })
        })

        const reader = res.body.getReader()
        const decoder = new TextDecoder()

        removeWritingIndicator()

        // create empty assistant bubble
        const container = document.createElement("div")
        container.className = "message assistant"

        const bubble = document.createElement("div")
        bubble.className = "bubble"

        container.appendChild(bubble)
        document.getElementById("messages").appendChild(container)

        let fullText = ""

        while (true) {

            const { done, value } = await reader.read()

            if (done) break

            const chunk = decoder.decode(value)

            const lines = chunk.split("\n")

            for (const line of lines) {

                if (!line.trim()) continue

                const data = JSON.parse(line)

                if (data.chat_id)
                    currentChat = data.chat_id

                if (data.token) {

                    fullText += data.token

                    bubble.innerText = fullText

                    scrollBottom()
                }
            }
        }

        // re-render with code blocks support
        container.remove()
        renderMessage("assistant", fullText)

        loadChats()

    } catch (err) {

        removeWritingIndicator()

        renderMessage("assistant", "Error: connection failed")
    }
}


function newChat() {

    currentChat = null

    document.getElementById("messages").innerHTML = ""
}

async function loadChats() {

    const res = await fetch("/get_chats")
    const chats = await res.json()

    const list = document.getElementById("chatList")
    list.innerHTML = ""

    for (const id in chats) {

        const div = document.createElement("div")
        div.className = "chat-item"

        if (id === currentChat)
            div.classList.add("active")

        const title = document.createElement("span")
        title.className = "chat-title"
        title.innerText = chats[id].title

        title.onclick = () => loadChat(id)

        const menuBtn = document.createElement("button")
        menuBtn.className = "chat-menu-btn"
        menuBtn.innerText = "⋯"

        menuBtn.onclick = (e) => {
            e.stopPropagation()
            toggleChatMenu(id, menuBtn)
        }

        div.appendChild(title)
        div.appendChild(menuBtn)

        list.appendChild(div)
    }
}


async function loadChat(id) {

    currentChat = id

    const res = await fetch("/load_chat/" + id)

    const data = await res.json()

    const messages = document.getElementById("messages")

    messages.innerHTML = ""

    data.messages.forEach(m => renderMessage(m.role, m.content))

    loadChats()
}

function copyCode(btn) {

    const code = btn.nextElementSibling.innerText

    navigator.clipboard.writeText(code)

    btn.innerText = "Copied"

    setTimeout(() => btn.innerText = "Copy", 1000)
}

loadChats()

let openMenu = null

function toggleChatMenu(chatId, btn) {

    closeMenu()

    const menu = document.createElement("div")
    menu.className = "chat-menu"

    menu.innerHTML = `
        <div class="chat-menu-item" onclick="renameChat('${chatId}')">Rename</div>
        <div class="chat-menu-item delete" onclick="deleteChat('${chatId}')">Delete</div>
    `

    document.body.appendChild(menu)

    const rect = btn.getBoundingClientRect()

    menu.style.top = rect.bottom + "px"
    menu.style.left = rect.left + "px"

    openMenu = menu

    setTimeout(() => {
        document.addEventListener("click", closeMenuOnce)
    }, 0)
}

function closeMenuOnce() {
    closeMenu()
    document.removeEventListener("click", closeMenuOnce)
}

function closeMenu() {
    if (openMenu) {
        openMenu.remove()
        openMenu = null
    }
}

async function renameChat(chatId) {

    const newName = prompt("New chat name:")

    if (!newName) return

    await fetch("/rename_chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            chat_id: chatId,
            title: newName
        })
    })

    loadChats()
}

async function deleteChat(chatId) {

    await fetch("/delete_chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            chat_id: chatId
        })
    })

    if (chatId === currentChat) {
        currentChat = null
        document.getElementById("messages").innerHTML = ""
    }

    loadChats()
}
let userMenu = null

function toggleUserMenu(event) {

    event.stopPropagation()

    if (userMenu) {
        closeUserMenu()
        return
    }

    const menu = document.createElement("div")
    menu.className = "user-menu"

    menu.innerHTML = `
        <div class="user-menu-item" onclick="selectUser()">
            👤 Switch account
        </div>

        <div class="user-menu-item" onclick="clearAllChats()">
            🧹 Clear conversations
        </div>

        <div class="user-menu-item danger" onclick="logout()">
            🚪 Log out
        </div>
    `

    document.body.appendChild(menu)

    const rect = document
        .querySelector(".user-card")
        .getBoundingClientRect()

    let menuTop = rect.top - menu.offsetHeight - 8

    if (menuTop < 10)
        menuTop = rect.bottom + 8

    menu.style.top = menuTop + "px"
    menu.style.left = rect.left + "px"

    userMenu = menu

    setTimeout(() => {
        document.addEventListener("click", closeUserMenu)
    }, 10)
}

function closeUserMenu() {

    if (userMenu) {

        userMenu.remove()
        userMenu = null

        document.removeEventListener("click", closeUserMenu)
    }

}

fetch("/me")
.then(r => r.json())
.then(user => {

    document.getElementById("username").innerText = user.name
    document.getElementById("userEmail").innerText = user.email
    document.getElementById("userAvatar").innerText =
        user.name.charAt(0).toUpperCase()

})

function logout() {
    location.href = "/logout"
}
function closeUserMenuOnce() {
    closeUserMenu()
    document.removeEventListener("click", closeUserMenuOnce)
}

function closeUserMenu() {

    if (userMenu) {
        userMenu.remove()
        userMenu = null
    }
}
async function clearAllChats() {

    if (!confirm("Delete all chats?")) return

    await fetch("/delete_all_chats", {
        method: "POST"
    })

    currentChat = null

    document.getElementById("messages").innerHTML = ""

    loadChats()
}
function selectUser() {

    location.href = "/select_user"
}

</script>

</body>
</html>
