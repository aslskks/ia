<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Assistant</title>

<link href="../static/chat.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="sidebar">

    <button class="new-chat" onclick="newChat()">
        + New chat
    </button>

    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-footer">

        <div class="user-card" onclick="toggleUserMenu(event)">

            <div class="user-left">

                <div class="user-avatar" id="userAvatar">
                    U
                </div>

                <div class="user-text">

                    <div class="user-name" id="username">
                        User Name
                    </div>

                    <div class="user-email" id="userEmail">
                        user@email.com
                    </div>

                </div>

            </div>

            <div class="user-arrow">
            </div>

        </div>

    </div>

</div>

<div class="main">

    <div class="messages" id="messages"></div>

    <div class="input-area">

        <div class="input-box">

            <textarea id="input" placeholder="Send a message..."></textarea>

            <button class="send" onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

</div>

</div>

<script>

let currentChat = null

function escapeHtml(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
}

function renderMessage(role, content) {

    const messages = document.getElementById("messages")

    const container = document.createElement("div")
    container.className = "message " + role

    const avatar = document.createElement("div")
    avatar.className = "avatar"

    avatar.innerText =
        role === "user"
        ? document.getElementById("userAvatar").innerText
        : "AI"

    const bubble = document.createElement("div")
    bubble.className = "bubble"
    bubble.innerHTML = formatMessage(content)

    // user derecha
    if (role === "user") {

        container.appendChild(bubble)
        container.appendChild(avatar)

    }

    // assistant izquierda
    else {

        container.appendChild(avatar)
        container.appendChild(bubble)

    }

    messages.appendChild(container)

    scrollBottom()
}



async function loadUser() {

    const res = await fetch("/me")
    const user = await res.json()

    document.getElementById("username").innerText = user.name
    document.getElementById("userEmail").innerText = user.email

    currentUserAvatar = user.name.charAt(0).toUpperCase()

    document.getElementById("userAvatar").innerText =
        currentUserAvatar
}


loadUser()



function renderWritingIndicator() {

    const container = document.createElement("div")
    container.className = "message assistant"

    container.id = "writingBubble"

    container.innerHTML = `
<div id="writingIndicator" class="writing-indicator" style="display:none;">
    writing<span id="dots"></span>
</div>

    `

    document.getElementById("messages").appendChild(container)

    scrollBottom()
}
const textarea = document.getElementById("input")

textarea.addEventListener("keydown", function(e) {
    // Enter = enviar
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault() // evita salto de línea
        sendMessage()
    }
})
textarea.addEventListener("input", function() {

    this.style.height = "auto"
    this.style.height = this.scrollHeight + "px"

})
function removeWritingIndicator() {

    const el = document.getElementById("writingBubble")

    if(el) el.remove()
}

function scrollBottom() {
    const m = document.getElementById("messages")
    m.scrollTop = m.scrollHeight
}
function formatMessage(text) {

    // escapar html
    text = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")

    // bloques de código
    text = text.replace(/```(\w+)?\n([\s\S]*?)```/g,
        '<pre class="code-block"><code>$2</code></pre>'
    )

    // saltos de linea SOLO fuera de código
    text = text.replace(/\n/g, "<br>")

    // arreglar doble <br> dentro de pre
    text = text.replace(/<pre class="code-block"><code>([\s\S]*?)<\/code><\/pre>/g,
        function(match, code) {

            const clean = code.replace(/<br>/g, "\n")

            return `<pre class="code-block"><code>${clean}</code></pre>`
        }
    )

    return text
}


async function sendMessage() {

    const input = document.getElementById("input")
    const text = input.value

    if (!text) return

    renderMessage("user", text)

    input.value = ""

    renderWritingIndicator()

    try {

        const res = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text,
                chat_id: currentChat,
                stream: true
            })
        })

        const reader = res.body.getReader()
        const decoder = new TextDecoder()

        removeWritingIndicator()

        // create empty assistant bubble
        const container = document.createElement("div")
        container.className = "message assistant"

        const bubble = document.createElement("div")
        bubble.className = "bubble"

        container.appendChild(bubble)
        document.getElementById("messages").appendChild(container)

        let fullText = ""
let buffer = ""

while (true) {

    const { done, value } = await reader.read()

    if (done) break

    buffer += decoder.decode(value, { stream: true })

    let lines = buffer.split("\n")

    // guardar última línea incompleta
    buffer = lines.pop()

    for (const line of lines) {

        if (!line.trim()) continue

        try {

            const data = JSON.parse(line)

            if (data.chat_id)
                currentChat = data.chat_id

            if (data.token) {

                fullText += data.token

                bubble.innerHTML = formatMessage(fullText)

                scrollBottom()
            }

        } catch (e) {

            console.error("JSON parse error:", e, line)

        }

    }
}

        bubble.innerHTML = formatMessage(fullText)

        loadChats()

    } catch (err) {

        removeWritingIndicator()

        renderMessage("assistant", "Error: connection failed")
    }
}


function newChat() {

    currentChat = null

    document.getElementById("messages").innerHTML = ""
}

async function loadChats() {

    const res = await fetch("/get_chats")
    const chats = await res.json()

    const list = document.getElementById("chatList")

    if (!list) {
        console.error("chatList no existe")
        return
    }

    list.innerHTML = ""

    for (const id in chats) {

        const div = document.createElement("div")
        div.className = "chat-item"

        if (id === currentChat)
            div.classList.add("active")

        div.onclick = function() {
            loadChat(id)
        }

        const title = document.createElement("div")
        title.innerText = chats[id].title

        const menuBtn = document.createElement("button")
        menuBtn.className = "chat-menu-btn"
        menuBtn.innerText = "⋯"

        menuBtn.onclick = function(e) {
            e.stopPropagation()
            toggleChatMenu(id, menuBtn)
        }

        div.appendChild(title)
        div.appendChild(menuBtn)

        list.appendChild(div)
    }
}


async function loadChat(chat_id) {

    currentChat = chat_id

    const res = await fetch("/messages/" + chat_id)

    const data = await res.json()

    const messages = document.getElementById("messages")

    messages.innerHTML = ""

    for (const msg of data) {

        renderMessage(msg.role, msg.content)

    }

}



loadChats()

let openMenu = null

function toggleChatMenu(chatId, btn) {

    closeMenu()

    const menu = document.createElement("div")
    menu.className = "chat-menu"

    menu.innerHTML = `
        <div class="chat-menu-item" onclick="renameChat('${chatId}')">Rename</div>
        <div class="chat-menu-item delete" onclick="deleteChat('${chatId}')">Delete</div>
    `

    document.body.appendChild(menu)

    const rect = btn.getBoundingClientRect()

    menu.style.top = rect.bottom + "px"
    menu.style.left = rect.left + "px"

    openMenu = menu

    setTimeout(() => {
        document.addEventListener("click", closeMenuOnce)
    }, 0)
}

function closeMenuOnce() {
    closeMenu()
    document.removeEventListener("click", closeMenuOnce)
}

function closeMenu() {
    if (openMenu) {
        openMenu.remove()
        openMenu = null
    }
}

async function renameChat(chatId) {

    const newName = prompt("New chat name:")

    if (!newName) return

    await fetch("/rename_chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            chat_id: chatId,
            title: newName
        })
    })

    loadChats()
}

async function deleteChat(chatId) {

    await fetch("/delete_chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            chat_id: chatId
        })
    })

    if (chatId === currentChat) {
        currentChat = null
        document.getElementById("messages").innerHTML = ""
    }

    loadChats()
}
let userMenu = null

function toggleUserMenu(event){

    event.stopPropagation();

    let old = document.querySelector(".user-menu");

    if(old){
        old.remove();
        return;
    }

    const menu = document.createElement("div");
    menu.className = "user-menu";

    menu.innerHTML = `
        <div class="user-menu-item" onclick="selectUser()">
            👤 Switch account
        </div>

        <div class="user-menu-item" onclick="clearAllChats()">
            🧹 Clear conversations
        </div>

        <div class="user-menu-divider"></div>

        <div class="user-menu-item danger" onclick="logout()">
            🚪 Log out
        </div>
    `;

    document.body.appendChild(menu);

    const rect = event.currentTarget.getBoundingClientRect();

    menu.style.left = rect.left + "px";
    menu.style.top = (rect.top - menu.offsetHeight - 10) + "px";
}


/* cerrar al hacer click fuera */
document.addEventListener("click", function(){

    const menu = document.querySelector(".user-menu");

    if(menu) menu.remove();

});


function closeUserMenu() {

    if (userMenu) {

        userMenu.remove()
        userMenu = null

        document.removeEventListener("click", closeUserMenu)
    }

}

fetch("/me")
.then(r => r.json())
.then(user => {

    document.getElementById("username").innerText = user.name
    document.getElementById("userEmail").innerText = user.email
    document.getElementById("userAvatar").innerText =
        user.name.charAt(0).toUpperCase()

})

function logout() {
    location.href = "/logout"
}
function closeUserMenuOnce() {
    closeUserMenu()
    document.removeEventListener("click", closeUserMenuOnce)
}

function closeUserMenu() {

    if (userMenu) {
        userMenu.remove()
        userMenu = null
    }
}
async function clearAllChats() {

    if (!confirm("Delete all chats?")) return

    await fetch("/delete_all_chats", {
        method: "POST"
    })

    currentChat = null

    document.getElementById("messages").innerHTML = ""

    loadChats()
}
function selectUser() {

    location.href = "/select_user"
}

</script>

</body>
</html>
