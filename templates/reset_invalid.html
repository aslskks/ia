<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Enlace inválido</title>
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #e74c3c;
            margin-bottom: 20px;
        }
        p {
            color: #555;
            margin-bottom: 20px;
        }
        a {
            display: inline-block;
            padding: 10px 20px;
            background: #0ef;
            color: #000;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }
        a:hover {
            background: #00cfff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>❌ Enlace inválido</h2>
        <p>{{ error }}</p>
        <a href="{{ url_for('forgot') }}">Solicitar nuevo enlace</a>
    </div>
</body>
</html>
